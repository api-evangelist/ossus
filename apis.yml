name: Ossus
description: >-
  Ossus builds AI-native intelligence for cultural institutions, starting with
  libraries. Its flagship product is Ossus ILS, a modern integrated library
  system that unifies cataloguing, circulation, acquisitions, analytics, and
  patron discovery in one interface, with an AI copilot that drafts MARC records,
  subjects, and classifications for librarian approval. A lighter product, Librar,
  targets school libraries with fast mobile setup. AI add-ons cover camera-based
  shelf inventory, vendor comparison for purchasing, and grant finding. Ossus
  emphasizes privacy-first design: it does not train on or sell customer data and
  works only with catalogue metadata rather than borrower records. Ossus is a
  Y Combinator (Winter 2026) company based in San Francisco.
